[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scspatial"
version = "0.1.0"
description = "Sensitivity of spatial transcriptomics conclusions to pipeline choices"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Apostolos Fysekidis" }]
keywords = ["single-cell", "spatial-transcriptomics", "scanpy", "squidpy", "scverse"]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
# scipy is here, not in the analysis extra, because matched_label_churn needs an
# assignment solver and that lives in the stability layer CI exercises. It is a numerics
# dependency, not the scverse stack -- which stays optional.
dependencies = ["numpy>=1.24", "scipy>=1.11"]

[project.optional-dependencies]
sc = ["scanpy>=1.10", "anndata>=0.10"]
spatial = ["squidpy>=1.5", "spatialdata>=0.2"]
figures = ["matplotlib>=3.7"]
dev = ["pytest>=7.0", "numpy>=1.24", "ruff>=0.6", "mypy>=1.11"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 95
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501", "B008", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "SIM117"]

[tool.mypy]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
exclude = ["^tests/"]
